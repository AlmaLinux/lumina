# Kept beside the playbooks so a deploy behaves the same from CI and from a laptop.
[defaults]
roles_path = roles
inventory = inventory
# Project-local, populated from requirements.yml. Deliberately not the system or user path: a lint or
# a deploy has to use the pinned versions, not whichever copy the machine happens to carry. Run
# ``ansible-galaxy collection install -r requirements.yml`` in this directory first; a missing
# collection then says so instead of silently resolving to something else.
collections_path = collections
# The dev host is created and recreated; its key changes with it, and the deploy verifies the key
# from a secret in CI instead (see .github/workflows/deploy-dev.yml). Left at the default here so a
# laptop run still checks against ~/.ssh/known_hosts.
host_key_checking = True
# Deploy output is read when something failed, so skip the noise from hosts that had nothing to do.
# Deliberately not stdout_callback = yaml: that callback ships in community.general, which nothing
# else here needs, and naming it makes the deploy depend on a collection that is not in
# requirements.yml. It also breaks outright on some ansible-core and community.general combinations.
display_skipped_hosts = False

[ssh_connection]
pipelining = True
